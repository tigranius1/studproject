<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать оценки</title>
</head>
<body>
    <h1>Редактировать оценки</h1>

    </form>
</body>
</html>
